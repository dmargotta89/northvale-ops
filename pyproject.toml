[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "northvale-ops"
version = "0.1.0"
description = "Northvale Home ops helpers: short links, SKU map, and static price cards. No publish automation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
northvale = "northvale.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
